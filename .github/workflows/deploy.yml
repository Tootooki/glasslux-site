name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4
      
      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # The directory on your server where files should go (e.g. public_html/ or public_html/my-site/)
          # Leave empty to upload to the root of the FTP account
          server-dir: ./ 
          # Files to exclude from upload
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
