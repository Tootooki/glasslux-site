<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlassLux</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #000;
      text-align: center;
    }
    .fallback {
      padding: 32px;
      max-width: 520px;
    }
    .phone {
      display: inline-block;
      margin-top: 16px;
      padding: 16px 24px;
      background: #a8fe28;
      color: #000;
      border-radius: 999px;
      text-decoration: none;
      font-size: 28px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="fallback">
    <h1>GlassLux</h1>
    <p>Loading website...</p>
    <a class="phone" href="tel:+15614517757">561-451-7757</a>
  </div>

  <script>
    (async function loadGlassLuxSite() {
      const sourceBlobApi = 'https://api.github.com/repos/Tootooki/glasslux-site/git/blobs/5cf1df7b2e002e6aa3c3c358062f5985e908d9b8';
      const telNumber = '+15614517757';
      const whatsappNumber = '15614517757';
      const displayNumber = '561-451-7757';

      function decodeBase64Utf8(base64) {
        const clean = base64.replace(/\s/g, '');
        const binary = atob(clean);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
      }

      function replacePhoneEverywhere(html) {
        return html
          .replace(/\+1\s*\(385\)\s*988-5129/g, displayNumber)
          .replace(/\(385\)\s*988-5129/g, displayNumber)
          .replace(/385\s*988\s*5129/g, displayNumber)
          .replace(/\+13859885129/g, telNumber)
          .replace(/13859885129/g, whatsappNumber)
          .replace(/YOUR_NUMBER/g, whatsappNumber);
      }

      try {
        const response = await fetch(sourceBlobApi, {
          headers: { 'Accept': 'application/vnd.github+json' },
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error('Unable to load website source.');
        }

        const blob = await response.json();
        const originalHtml = decodeBase64Utf8(blob.content);
        const updatedHtml = replacePhoneEverywhere(originalHtml);

        document.open();
        document.write(updatedHtml);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<div class="fallback"><h1>GlassLux</h1><p>Please call or text us:</p><a class="phone" href="tel:' + telNumber + '">' + displayNumber + '</a></div>';
      }
    })();
  </script>
</body>
</html>
