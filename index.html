<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlassLux</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #000;
      text-align: center;
    }
    .fallback {
      padding: 32px;
      max-width: 520px;
    }
    .phone, .email {
      display: inline-block;
      margin-top: 16px;
      padding: 16px 24px;
      background: #a8fe28;
      color: #000;
      border-radius: 999px;
      text-decoration: none;
      font-size: 24px;
      font-weight: 800;
    }
    .email {
      background: #f5f5f5;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="fallback">
    <h1>GlassLux</h1>
    <p>Loading website...</p>
    <a class="phone" href="tel:+15614517757">561-451-7757</a><br>
    <a class="email" href="mailto:GlassLuxllc@gmail.com">GlassLuxllc@gmail.com</a>
  </div>

  <script>
    (async function loadGlassLuxSite() {
      const sourceBlobApi = 'https://api.github.com/repos/Tootooki/glasslux-site/git/blobs/5cf1df7b2e002e6aa3c3c358062f5985e908d9b8';
      const telNumber = '+15614517757';
      const whatsappNumber = '15614517757';
      const displayNumber = '561-451-7757';
      const emailAddress = 'GlassLuxllc@gmail.com';

      function decodeBase64Utf8(base64) {
        const clean = base64.replace(/\s/g, '');
        const binary = atob(clean);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
      }

      function replacePhoneEverywhere(html) {
        return html
          .replace(/\+1\s*\(385\)\s*988-5129/g, displayNumber)
          .replace(/\(385\)\s*988-5129/g, displayNumber)
          .replace(/385\s*988\s*5129/g, displayNumber)
          .replace(/\+13859885129/g, telNumber)
          .replace(/13859885129/g, whatsappNumber)
          .replace(/YOUR_NUMBER/g, whatsappNumber);
      }

      function replaceEmailEverywhere(html) {
        return html
          .replace(/mailto:info@glasslux\.us/gi, 'mailto:' + emailAddress)
          .replace(/info@glasslux\.us/gi, emailAddress)
          .replace(/GlassLuxllc@gmail\.com/gi, emailAddress)
          .replace(/glassluxllc@gmail\.com/gi, emailAddress);
      }

      function addSuperGlassEverywhere(html) {
        const logoBylineCss = `
        .logo-superglass-byline,
        .footer-superglass-byline {
          margin-top: 8px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          font-size: clamp(20px, 5vw, 36px);
          font-weight: 800;
          letter-spacing: 0.04em;
          color: #55aa36;
          text-align: center;
          line-height: 1.1;
        }
        .footer-superglass-byline {
          margin-top: 6px;
          font-size: 18px;
          color: #a8fe28;
        }
        .logo-block-inner {
          flex-direction: column;
        }
        `;

        let updated = html.replace('</style>', logoBylineCss + '\n    </style>');

        updated = updated.replace(
          /(<img\s+src="glasslux-logo\.jpg"\s+alt="GlassLux Logo"\s*>)/g,
          '$1\n                    <div class="logo-superglass-byline">by SuperGlass</div>'
        );

        updated = updated.replace(
          /(<div class="footer-logo">\s*<span class="footer-logo-text">\s*<span class="logo-glass">GLASS<\/span><span class="logo-lux">LUX<\/span>\s*<\/span>\s*)<\/div>/,
          '$1<div class="footer-superglass-byline">by SuperGlass</div>\n            </div>'
        );

        return updated;
      }

      try {
        const response = await fetch(sourceBlobApi, {
          headers: { 'Accept': 'application/vnd.github+json' },
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error('Unable to load website source.');
        }

        const blob = await response.json();
        const originalHtml = decodeBase64Utf8(blob.content);
        let updatedHtml = replacePhoneEverywhere(originalHtml);
        updatedHtml = replaceEmailEverywhere(updatedHtml);
        updatedHtml = addSuperGlassEverywhere(updatedHtml);

        document.open();
        document.write(updatedHtml);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<div class="fallback"><h1>GlassLux</h1><p>by SuperGlass</p><p>Please call, text, or email us:</p><a class="phone" href="tel:' + telNumber + '">' + displayNumber + '</a><br><a class="email" href="mailto:' + emailAddress + '">' + emailAddress + '</a></div>';
      }
    })();
  </script>
</body>
</html>
